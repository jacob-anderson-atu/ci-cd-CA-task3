name: CI/CD Pipeline

on:
  push:
    branches:
      - main # merges or pushes directly to main
  pull_request:
    branches:
      - main # pull requests to main branch

permissions: #GitHub perms
  contents: read
  id-token: write
  packages: write

jobs:
  quality-and-test: #Python, Ruff, Bandit, Pytest
    name: Quality and Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Ruff static analysis
        run: ruff check .

      - name: Run Bandit security analysis
        run: bandit -r app

      - name: Run automated tests
        run: python -m pytest -v

  build-and-security: #docker, Trivy, GHCR push
    name: Container Build and Security Scan
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t devops-pipeline:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-pipeline:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-pipeline"
          docker tag devops-pipeline:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker tag devops-pipeline:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  infrastructure-and-deploy: #AWS OIDC, Terraform, AWS SSM, health checks
    name: Infrastructure and Deployment
    needs: build-and-security
    runs-on: ubuntu-latest

    env:
      TF_VAR_ssh_cidr: ${{ secrets.TF_VAR_SSH_CIDR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform initialize
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Get deployment host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: |
          EC2_HOST=$(terraform output -raw public_ip)
          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"

      - name: Get EC2 instance ID
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Wait for EC2 to become SSM managed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Caller identity:"
          aws sts get-caller-identity

          echo "Target instance: $INSTANCE_ID"

          echo "Testing Systems Manager access:"
          aws ssm describe-instance-information \
            --region "${{ vars.AWS_REGION }}" \
            --output table

          echo "Waiting for instance $INSTANCE_ID to become available in Systems Manager..."

          for i in {1..30}; do
            STATUS=$(aws ssm describe-instance-information \
              --region "${{ vars.AWS_REGION }}" \
              --query "InstanceInformationList[?InstanceId=='$INSTANCE_ID'].PingStatus | [0]" \
              --output text)

            echo "Attempt $i: SSM status is '$STATUS'"

            if [ "$STATUS" = "Online" ]; then
              echo "Instance is online in Systems Manager."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for instance $INSTANCE_ID to become SSM managed."

          aws ec2 describe-instances \
            --region "${{ vars.AWS_REGION }}" \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].[State.Name,IamInstanceProfile.Arn,PublicIpAddress]" \
            --output table || true

          aws ssm describe-instance-information \
            --region "${{ vars.AWS_REGION }}" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --output table || true


          exit 1

      - name: Deploy monitoring stack through AWS Systems Manager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-pipeline:${{ github.sha }}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/${{ github.sha }}.tar.gz"
          # Encode deployment script to avoid nested YAML, JSON, and shell quoting
          SCRIPT_BASE64=$(base64 -w 0 scripts/deploy-stack.sh)

          jq -n \
            --arg instance_id "$INSTANCE_ID" \
            --arg image "$IMAGE" \
            --arg release_url "$RELEASE_URL" \
            --arg script_base64 "$SCRIPT_BASE64" \
            '{
              InstanceIds: [$instance_id],
              DocumentName: "AWS-RunShellScript",
              Comment: "Deploy monitored application stack",
              Parameters: {
                commands: [
                  "echo '\''" + $script_base64 + "'\'' | base64 -d > /tmp/deploy-stack.sh",
                  "chmod 700 /tmp/deploy-stack.sh",
                  "/tmp/deploy-stack.sh '\''" + $image + "'\'' '\''" + $release_url + "'\''",
                  "rm -f /tmp/deploy-stack.sh"
                ]
              }
            }' > /tmp/ssm-deployment.json

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ vars.AWS_REGION }}" \
            --cli-input-json file:///tmp/ssm-deployment.json \
            --query "Command.CommandId" \
            --output text)

          rm -f /tmp/ssm-deployment.json

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Deployment command: $COMMAND_ID"

      - name: Wait for deployment and show results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          echo "Waiting for SSM deployment command $COMMAND_ID..."

          FINAL_STATUS=""
          # standard AWS waiter ended up being too short for my compose deployment
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ vars.AWS_REGION }}" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: deployment status is '$STATUS'"

            case "$STATUS" in
              Success)
                FINAL_STATUS="Success"
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                FINAL_STATUS="$STATUS"
                break
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                echo "Unexpected SSM status: $STATUS"
                sleep 10
                ;;
            esac
          done

          if [ -z "$FINAL_STATUS" ]; then
            FINAL_STATUS="WorkflowTimeout"
          fi

          echo "Deployment command result:"

          aws ssm get-command-invocation \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status:Status,
              StatusDetails:StatusDetails,
              ResponseCode:ResponseCode,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }'

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "Deployment did not complete successfully: $FINAL_STATUS"
            exit 1
          fi

          echo "SSM deployment completed successfully."

      - name: Verify public deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: |
          APP_URL=$(terraform output -raw application_url)

          echo "Checking $APP_URL/health"

          for i in {1..12}; do
            if curl --fail --silent "$APP_URL/health"; then
              echo
              echo "Deployment verified successfully."
              exit 0
            fi

            sleep 5
          done

          echo "Public deployment health check failed."
          exit 1



