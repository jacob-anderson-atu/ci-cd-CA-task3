name: AWS OIDC Test

on:
  workflow_dispatch:
  push:
    branches:
    - aws-deployment

permissions:
  contents: read
  id-token: write

jobs:
  test-aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | python -c \
            "import json,sys; print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          python - "$PAYLOAD" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("repository_id:", claims.get("repository_id"))
          print("repository_owner:", claims.get("repository_owner"))
          print("repository_owner_id:", claims.get("repository_owner_id"))
          print("ref:", claims.get("ref"))
          PY
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity