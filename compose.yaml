services:
  app:
    image: ${APP_IMAGE:-devops-pipeline:local}
    container_name: devops-pipeline
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
    ports:
      - "80:5000"
    networks:
      - monitoring
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - monitoring
    
networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data: